<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login &mdash; Cycle Ella</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E5457A'/%3E%3Cstop offset='1' stop-color='%239B4DB5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='url(%23g)'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-family='system-ui' font-weight='900' font-size='22' fill='%23fff'%3EE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/dashboard/css/tokens.css" />
  <link rel="stylesheet" href="/dashboard/css/layout.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <span class="logo" id="login-logo"></span>
      <h1>Cycle Ella Admin</h1>
      <p class="sub">Sign in to view system analytics</p>
      <div class="login-error" id="login-error"></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary" type="submit" id="login-submit">Log in</button>
      </form>
    </div>
  </div>

  <script src="/dashboard/js/layout.js"></script>
  <script src="/dashboard/js/api.js"></script>
  <script src="/dashboard/js/login.js"></script>
</body>
</html>
